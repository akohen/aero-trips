name: Deploy to Firebase on tag

on:
  push:
    tags:
      - '*'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci && npm run build
      # Functions are built by the firebase.json predeploy hooks.
      # action-hosting-deploy can only deploy Hosting, so the CLI does it all:
      # `firebase deploy` always deploys functions before hosting, which is
      # what the /mcp rewrite needs. Firestore rules (firestore.rules) and the
      # passports function ship with every release too. --force acknowledges
      # the passports function's retry policy, which the CLI otherwise asks
      # to confirm (fatal in --non-interactive).
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AERO_TRIPS }}'
      - run: npx --yes firebase-tools@latest deploy --only firestore:rules,functions:mcp,functions:passports,hosting --project aero-trips --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
