name: Deploy to Firebase on tag

on:
  push:
    tags:
      - '*'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci && npm run build
      # The MCP function is built by the firebase.json predeploy hook.
      # action-hosting-deploy can only deploy Hosting, so the CLI does both:
      # `firebase deploy` always deploys functions before hosting, which is
      # what the /mcp rewrite needs.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AERO_TRIPS }}'
      - run: npx --yes firebase-tools@latest deploy --only functions:mcp,hosting --project aero-trips --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
